<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Слоты услуги</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-4">
    <h1 class="h4 mb-4">Слоты для услуги №{{ service_id }}</h1>

    <form method="post" class="row g-3 mb-4">
      <div class="col-12 col-md-10">
        <input type="text" name="time_slot" class="form-control" placeholder="Например, 10:00 или 15:30" required>
      </div>
      <div class="col-12 col-md-2">
        <button type="submit" class="btn btn-success w-100">Добавить</button>
      </div>
    </form>

    <div class="table-responsive">
      <table class="table table-bordered">
        <thead class="table-dark">
          <tr>
            <th>Время</th>
            <th>Удалить</th>
          </tr>
        </thead>
        <tbody>
          {% for slot in slots %}
          <tr>
            <td>{{ slot[1] }}</td>
            <td>
              <a href="{{ url_for('delete_slot', service_id=service_id, slot_id=slot[0]) }}" class="btn btn-danger btn-sm w-100">Удалить</a>
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>

    <a href="{{ url_for('admin_panel') }}" class="btn btn-secondary mt-3">Назад</a>
  </div>
</body>
</html>
